name: collector
description: "Scan a coin or banknote, identify it and keep notes on every piece."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  hive_ce: ^2.24.0
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
